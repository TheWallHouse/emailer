name: Build Windows installer (i18n test build)

# Test build of the i18n-es branch for a Spanish-speaking tester: builds
# only the Windows NSIS installer and uploads it as a workflow artifact.
# No release is published and no updater artifacts are signed (the fork
# has no signing key), so createUpdaterArtifacts is switched off here.
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
      - build-windows

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3db9de313aa3e84732d075f6fd8938cc0d6d4b58 # 1.96.0

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build installer
        shell: bash
        run: bun run tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Emailer-windows-es
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
